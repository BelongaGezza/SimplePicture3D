[[permission]]
identifier = "allow-depth-map"
description = "Enables depth map generation, retrieval, histogram, adjustment, undo/redo, and reset. Mask commands are in allow-mask.toml."
commands.allow = [
    "generate_depth_map",
    "get_depth_map",
    "get_depth_histogram",
    "set_depth_adjustment_params",
    "get_depth_adjustment_params",
    "get_undo_redo_state",
    "undo",
    "redo",
    "clear_history",
    "reset_depth_adjustments",
]
